<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiago Verse — Official Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--y:#ffffff;--y2:#b8b8b8;--bg:#07070a;--card:#111115;--line:rgba(255,255,255,.16);--tx:#f5f5f0;--mu:#9a9a92;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,.num{font-family:'Space Grotesk',Inter,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:.14em;font-size:15px}
.logo b{color:var(--y)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;font-weight:600;font-size:14px;text-decoration:none;color:#111;background:linear-gradient(135deg,var(--y),var(--y2));box-shadow:0 8px 28px rgba(255,255,255,.25);transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(255,255,255,.4)}
.btn.ghost{background:transparent;color:var(--y);border:1px solid var(--line);box-shadow:none}
.tag{font-size:12px;letter-spacing:.2em;color:var(--y);text-transform:uppercase;margin:34px 0 14px;display:flex;justify-content:space-between;align-items:center}
/* carousel */
.car{position:relative}
.track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:6px 2px 14px}
.track::-webkit-scrollbar{display:none}
.vid{flex:0 0 min(86%,520px);scroll-snap-align:center;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:.3s;position:relative}
.vid:hover{transform:translateY(-4px);border-color:var(--y)}
.th{aspect-ratio:16/9;position:relative;background:linear-gradient(135deg,#111111,#262626 55%,#ffffff22);overflow:hidden}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{position:absolute;inset:0;margin:auto;width:62px;height:62px;border-radius:50%;background:var(--y);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(255,255,255,.2);transition:.3s}
.vid:hover .play{transform:scale(1.12)}
.play:after{content:"";border-left:18px solid #111;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.vi{padding:16px 18px 18px}
.vi h3{font-size:16px;font-weight:600;line-height:1.35}
.vi p{color:var(--mu);font-size:13px;margin-top:6px}
.arr{position:absolute;top:38%;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(7,7,10,.8);color:var(--y);font-size:18px;cursor:pointer;backdrop-filter:blur(8px);z-index:2}
.arr.l{left:-8px}.arr.r{right:-8px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:4px}
.dots i{width:7px;height:7px;border-radius:9px;background:#333;transition:.3s}
.dots i.on{width:24px;background:var(--y)}
/* hero */
.hero{text-align:center;padding:38px 0 10px}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);border:1px solid var(--line);padding:7px 14px;border-radius:99px}
.dot{width:8px;height:8px;border-radius:50%;background:#666}
.live.on .dot{background:var(--y);box-shadow:0 0 0 0 var(--y);animation:p 1.6s infinite}
@keyframes p{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
h1{font-size:clamp(40px,9vw,84px);line-height:1;margin:20px 0 12px;letter-spacing:-.02em}
h1 span{background:linear-gradient(135deg,var(--y),var(--y2) 60%,#ffffff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);max-width:520px;margin:0 auto 26px;line-height:1.6}
.big{font-size:clamp(46px,12vw,110px);font-weight:700;color:var(--y);text-shadow:0 0 60px rgba(255,255,255,.35);line-height:1}
.bl{color:var(--mu);font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin-top:8px}
.cta{display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap}
/* socials */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.soc{display:flex;align-items:center;gap:14px;padding:18px;border-radius:20px;background:linear-gradient(160deg,#16161a,#0e0e11);border:1px solid var(--line);text-decoration:none;color:inherit;transition:.3s;position:relative;overflow:hidden}
.soc:hover{transform:translateY(-4px);border-color:var(--y);box-shadow:0 14px 40px rgba(255,255,255,.12)}
.ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:var(--y);flex:none}
.ic svg{width:24px;height:24px;fill:currentColor}
.soc b{display:block;font-size:13px;color:var(--mu);font-weight:500}
.soc .num{font-size:22px;font-weight:700}
.go{margin-left:auto;color:var(--y);opacity:0;transition:.3s}
.soc:hover .go{opacity:1}
footer{text-align:center;color:var(--mu);font-size:13px;padding:50px 0 34px}
.note{font-size:11px;color:#666;margin-top:8px}

/* ===== glass + colour-shifting background ===== */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;animation:hue 20s linear infinite}
.bg i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.55}
.bg i:nth-child(1){background:#6d28d9;top:-25%;left:-20%;animation:f1 24s ease-in-out infinite alternate}
.bg i:nth-child(2){background:#0ea5e9;bottom:-30%;right:-20%;animation:f2 28s ease-in-out infinite alternate}
.bg i:nth-child(3){background:#ec4899;top:30%;left:30%;width:40vmax;height:40vmax;opacity:.35;animation:f3 32s ease-in-out infinite alternate}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes f1{to{transform:translate(35vw,30vh) scale(1.25)}}
@keyframes f2{to{transform:translate(-35vw,-25vh) scale(1.15)}}
@keyframes f3{to{transform:translate(-20vw,20vh) scale(1.3)}}
body::after{content:"";position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.wrap{position:relative;z-index:1}
.vid,.soc,.live,.arr,.btn.ghost{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.05),0 18px 50px rgba(0,0,0,.35)}
.btn.ghost{color:var(--tx)}
.vid:hover,.soc:hover{border-color:rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 18px 50px rgba(0,0,0,.4),0 0 40px rgba(255,255,255,.12)}
.vid:before,.soc:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.22) 0,rgba(255,255,255,0) 38%);z-index:1;opacity:.55}
.th{background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.02))}
.vi,.soc>*{position:relative;z-index:2}
.ic{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px)}
.dots i{background:rgba(255,255,255,.25)}.dots i.on{background:var(--y)}
@media (prefers-reduced-motion:reduce){.bg,.bg i{animation:none}}

/* ===== pure black + glass only ===== */
:root{--bg:#000}
body{background:#000}
.bg{animation:none;filter:none}
.bg i{background:#fff!important;opacity:.07!important;filter:blur(110px);animation:none!important}
.bg i:nth-child(1){top:-30%;left:-20%}
.bg i:nth-child(2){bottom:-35%;right:-20%}
.bg i:nth-child(3){opacity:.04!important}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div class="wrap">
  <nav><div class="logo">TIAGO<b>VERSE</b></div><a class="btn" id="subTop" href="#" target="_blank" rel="noopener">Subscribe</a></nav>

  <!-- VIDEO CAROUSEL (TOP) -->
  <div class="tag"><span>Latest videos</span><a href="#" id="allVid" target="_blank" rel="noopener" style="color:var(--mu);text-decoration:none;letter-spacing:.1em">View all →</a></div>
  <div class="car">
    <button class="arr l" aria-label="Previous" id="pv">‹</button>
    <div class="track" id="track"></div>
    <button class="arr r" aria-label="Next" id="nx">›</button>
    <div class="dots" id="dots"></div>
  </div>

  <!-- HERO + LIVE COUNT -->
  <section class="hero">
    <div class="live" id="live"><span class="dot"></span><span id="status">Preview mode</span></div>
    <h1>Welcome to the <span>TIAGO VERSE</span></h1>
    <p class="sub">Videos, behind-the-scenes and everything in between. Join the community across every platform.</p>
    <div class="big num" id="count">0</div>
    <div class="bl">YouTube subscribers</div>
    <div class="cta"><a class="btn" id="subHero" href="#" target="_blank" rel="noopener">▶ Subscribe on YouTube</a><a class="btn ghost" href="#socials">All platforms</a></div>
  </section>

  <!-- SOCIALS -->
  <div class="tag" id="socials"><span>Follow everywhere</span></div>
  <div class="grid" id="grid"></div>

  <footer>© <span id="yr"></span> 7edhee. All rights reserved.<div class="note"></div></footer>
</div>

<script>
/* ============ CONFIG — edit this ============ */
const CONFIG={
  name:"TIAGO VERSE",
  channelUrl:"https://youtube.com/@tiago_verse",
  channelId:"",            // e.g. UCxxxxxxxxxxxxxxxx
  apiKey:"",               // YouTube Data API v3 key
  fallbackSubs:1250000,    // shown if API not set
  refreshSec:60,
  videos:[                 // YouTube video IDs + titles
    {id:"VIDEO_ID_1",title:"Your latest video title goes here",meta:"1.2M views · 2 days ago"},
    {id:"VIDEO_ID_2",title:"Another banger upload",meta:"860K views · 1 week ago"},
    {id:"VIDEO_ID_3",title:"The video everyone is talking about",meta:"2.4M views · 2 weeks ago"},
    {id:"VIDEO_ID_4",title:"Behind the scenes special",meta:"540K views · 3 weeks ago"},
    {id:"VIDEO_ID_5",title:"Q&A with the community",meta:"390K views · 1 month ago"}
  ],
  socials:[
    {n:"YouTube",c:"1.25M",u:"https://youtube.com/@tiago_verse",p:"M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2C.5 9.1.5 12 .5 12s0 2.9.5 4.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-4.8.5-4.8s0-2.9-.5-4.8zM9.7 15.5v-7l6 3.5-6 3.5z"},
    {n:"Instagram",c:"820K",u:"https://instagram.com/yourhandle",p:"M12 2.2c3.2 0 3.6 0 4.8.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-3.3-.1-4.8-1.7-4.9-4.9C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8C2.4 3.9 4 2.4 7.2 2.3 8.4 2.2 8.8 2.2 12 2.2zM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4zm5.2-9.7a1.2 1.2 0 1 0 0 2.400 1.200 1.200 0 0 0 0-2.400z"},
    {n:"Discord",c:"95K",u:"https://discord.gg/yourinvite",p:"M20.300 4.400A19.800 19.800 0 0 0 15.400 3l-.6 1.300a18.300 18.300 0 0 0-5.600 0L8.600 3a19.700 19.700 0 0 0-4.900 1.500C.600 9.100-.2 13.600.2 18.100a19.900 19.900 0 0 0 6 3l1.300-2.100c-.7-.3-1.400-.6-2-1l.5-.4a14.200 14.200 0 0 0 12 0l.5.400c-.6.400-1.300.7-2 1l1.300 2.100a19.900 19.900 0 0 0 6-3c.5-5.200-.8-9.700-3.500-13.700zM8 15.300c-1.200 0-2.100-1.100-2.100-2.400s.9-2.400 2.100-2.400 2.100 1.100 2.100 2.400-.9 2.400-2.100 2.400zm8 0c-1.200 0-2.100-1.100-2.100-2.400s.9-2.400 2.100-2.400 2.100 1.100 2.100 2.400-.9 2.400-2.100 2.400z"},
    {n:"Kick",c:"120K",u:"https://kick.com/yourhandle",p:"M1.333 0h8v5.333H12V2.667h2.667V0h8v8H20v2.667h-2.667v2.666H20V16h2.667v8h-8v-2.667H12v-2.666H9.333V24h-8Z"},
    {n:"Twitch",c:"210K",u:"https://twitch.tv/yourhandle",p:"M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.43l-3 3v-3H6.857V1.714h13.714Z"}
  ]
};
/* ============================================ */
const $=s=>document.querySelector(s);
const fmt=n=>n>=1e6?(n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M':n>=1e3?(n/1e3).toFixed(1).replace(/\.0$/,'')+'K':String(n);
$('#yr').textContent=new Date().getFullYear();
['#subTop','#subHero','#allVid'].forEach(s=>{const a=$(s);a.href=CONFIG.channelUrl+(s==='#allVid'?'/videos':'?sub_confirmation=1')});

/* carousel */
const tr=$('#track'),dots=$('#dots');
CONFIG.videos.forEach((v,i)=>{
  const real=!/^VIDEO_ID/.test(v.id);
  const a=document.createElement('a');a.className='vid';a.target='_blank';a.rel='noopener';
  a.href=real?'https://www.youtube.com/watch?v='+v.id:CONFIG.channelUrl;
  a.innerHTML='<div class="th">'+(real?'<img loading="lazy" alt="" src="https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg" onerror="this.remove()">':'')+'<div class="play"></div></div><div class="vi"><h3></h3><p></p></div>';
  a.querySelector('h3').textContent=v.title;a.querySelector('p').textContent=v.meta||'';
  tr.appendChild(a);
  const d=document.createElement('i');dots.appendChild(d);
});
let idx=0,auto;
const cards=()=>[...tr.children];
function go(i){idx=(i+cards().length)%cards().length;const c=cards()[idx];tr.scrollTo({left:c.offsetLeft-(tr.clientWidth-c.clientWidth)/2,behavior:'smooth'})}
function mark(){const mid=tr.scrollLeft+tr.clientWidth/2;let b=0,bd=1e9;cards().forEach((c,i)=>{const d=Math.abs(c.offsetLeft+c.clientWidth/2-mid);if(d<bd){bd=d;b=i}});idx=b;[...dots.children].forEach((d,i)=>d.classList.toggle('on',i===b))}
tr.addEventListener('scroll',mark,{passive:true});mark();
$('#pv').onclick=()=>{go(idx-1);rst()};$('#nx').onclick=()=>{go(idx+1);rst()};
function rst(){clearInterval(auto);auto=setInterval(()=>go(idx+1),4500)}rst();
tr.addEventListener('pointerdown',()=>clearInterval(auto));

/* socials */
const grid=$('#grid');
CONFIG.socials.forEach(s=>{
  const a=document.createElement('a');a.className='soc';a.href=s.u;a.target='_blank';a.rel='noopener';
  a.innerHTML='<div class="ic"><svg viewBox="0 0 24 24"><path d="'+s.p+'"/></svg></div><div><b></b><span class="num"></span></div><span class="go">↗</span>';
  a.querySelector('b').textContent=s.n;a.querySelector('.num').textContent=s.c;
  grid.appendChild(a);
});

/* live subscriber count */
let shown=0;
function animate(to){const from=shown,t0=performance.now(),dur=1600;
  (function f(t){const p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,4);shown=Math.round(from+(to-from)*e);$('#count').textContent=shown.toLocaleString();if(p<1)requestAnimationFrame(f)})(t0)}
async function live(){
  if(!CONFIG.apiKey||!CONFIG.channelId){animate(CONFIG.fallbackSubs);return}
  try{
    const r=await fetch('https://www.googleapis.com/youtube/v3/channels?part=statistics&id='+CONFIG.channelId+'&key='+CONFIG.apiKey);
    const j=await r.json();const n=+j.items[0].statistics.subscriberCount;
    animate(n);$('#live').classList.add('on');$('#status').textContent='Live count';
    const yt=CONFIG.socials.find(s=>s.n==='YouTube');
  }catch(e){animate(CONFIG.fallbackSubs);$('#status').textContent='Preview mode'}
}
live();setInterval(()=>{if(CONFIG.apiKey&&CONFIG.channelId)live()},CONFIG.refreshSec*1000);
</script>
</body>
</html>
